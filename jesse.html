<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover is REQUIRED, not cosmetic. Without it every
     env(safe-area-inset-*) below evaluates to 0, and because the status bar is
     black-translucent the installed iOS app draws its top bar underneath the
     notch -- where the buttons in it cannot be tapped at all. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- iOS picks the Home Screen icon from here, not from the manifest: it will
     not rasterise an SVG for it and it renders transparency as black. This one
     is a full-bleed PNG with no rounding of its own, because iOS applies the
     corners itself and would otherwise round an already-rounded square twice.
     It is the plain mark, not the "SW" monogram in favicon.png -- an icon on a
     Home Screen is about as public as this thing gets. -->
<link rel="apple-touch-icon" href="/private-icon-180.png">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<!-- Installable, because iOS grants web push only to installed pages. The
     manifest is named "Private" and carries no description: it becomes the
     label under the Home Screen icon, where anyone glancing at the phone can
     read it. -->
<link rel="manifest" href="/jesse-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Private">
<meta name="theme-color" content="#0a192f">
<!--
  Private thread. Deliberately absent from sitemap.xml, unlinked from every
  other page, and served with X-Robots-Tag from both netlify.toml and _headers.

  Nothing on the locked screen names anyone or says what this is. A stranger who
  guesses the URL should learn nothing from it. That is why the <title> is bland
  and the logged-out markup carries no names, no file list and no history --
  everything below the gate is fetched only after the PIN is accepted. Keep it
  that way: anything hard-coded into this file is readable by the public.

  The PIN is checked in netlify/functions/jesse-api.mjs, server-side, against
  environment variables. This repository is PUBLIC. No secret belongs in here.
-->
<title>Private</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* The browser's own rule for the hidden attribute is [hidden]{display:none},
   and ANY author `display:` beats it -- author styles win over the user-agent
   sheet regardless of specificity. Several panels below are flex containers
   that are shown and hidden by toggling `hidden`, so without this they ignore
   the attribute completely. That is not hypothetical: it is how the recording
   bar came to sit permanently under the composer, and how a full-screen call
   overlay covered the entire thread. !important so a later `display:` on one
   of those panels cannot quietly reintroduce it. */
[hidden]{display:none!important}
:root{--navy-dark:#0a192f;--navy:#112240;--accent:#64ffda;--bright:#57cbff;--slate:#8892b0;--light:#a8b2d1;--lightest:#ccd6f6;--white:#e6f1ff;--gold:#F9A825}
/* iOS counts the address bar in 100vh, so a full-height flex column ends up
   taller than the screen and the composer sits under the browser chrome. dvh
   fixes it on modern iOS; -webkit-fill-available covers the older ones. Both
   are behind the plain 100% so nothing regresses on desktop. */
html,body{height:100%;height:-webkit-fill-available}
@supports (height:100dvh){html,body{height:100dvh}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--navy-dark);color:var(--lightest);line-height:1.6;font-size:17px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}

/* ---------------------------------------------------------------- locked */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.gate form{width:100%;max-width:300px;text-align:center}
.gate label{display:block;color:var(--slate);font-size:.95rem;margin-bottom:.9rem;letter-spacing:.02em}
.pin{width:100%;background:var(--navy);border:1px solid rgba(100,255,218,.25);border-radius:10px;color:var(--white);font-family:ui-monospace,Consolas,monospace;font-size:1.8rem;letter-spacing:.35em;text-align:center;padding:.85rem .5rem;text-indent:.35em}
.pin:focus{outline:none;border-color:var(--accent)}
.gate button{width:100%;margin-top:.9rem;background:var(--accent);color:#08131f;border:none;border-radius:10px;font-size:1.05rem;font-weight:700;padding:.85rem;cursor:pointer;font-family:inherit}
.gate button:disabled{opacity:.45;cursor:default}
.err{min-height:1.4rem;margin-top:.85rem;color:var(--gold);font-size:.92rem}

/* ---------------------------------------------------------------- shell */
.app{display:none;flex-direction:column;height:100%}
.app.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1.15rem;border-bottom:1px solid rgba(100,255,218,.15);flex:none}
.bar .me{color:var(--slate);font-size:.9rem}
.bar .me b{color:var(--accent);font-weight:600}
.bar nav{display:flex;gap:.4rem;align-items:center}
.bar a,.bar button{background:transparent;border:1px solid rgba(136,146,176,.35);color:var(--slate);font-size:.82rem;padding:.35rem .7rem;border-radius:6px;cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap}
.bar a:hover,.bar button:hover{color:var(--accent);border-color:var(--accent)}
#filesToggle{display:none}

.cols{flex:1;display:flex;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------------------------------------------------------------- thread */
.compose{flex:none;padding:1rem 1.15rem;border-bottom:1px solid rgba(100,255,218,.12)}
.compose textarea{width:100%;background:var(--navy);border:1px solid rgba(100,255,218,.2);border-radius:10px;color:var(--white);font-family:inherit;font-size:1rem;line-height:1.55;padding:.8rem .9rem;resize:vertical;min-height:5.2rem}
.compose textarea:focus{outline:none;border-color:var(--accent)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:.6rem;flex-wrap:wrap}
.crow .hint{color:var(--slate);font-size:.8rem;flex:1;min-width:0}
.tools{display:flex;align-items:center;gap:.5rem;flex:none}
.crow button{background:var(--accent);color:#08131f;border:none;border-radius:8px;font-size:.95rem;font-weight:700;padding:.6rem 1.5rem;cursor:pointer;font-family:inherit}
.crow button:disabled{opacity:.4;cursor:default}
button.tool{background:transparent;border:1px solid rgba(100,255,218,.35);color:var(--accent);font-size:.95rem;font-weight:700;padding:.55rem .8rem;line-height:1;min-width:3rem}
button.tool:hover{background:rgba(100,255,218,.12)}
button.tool.on{background:rgba(100,255,218,.18)}
button.tool:disabled{opacity:.35;cursor:default}
button.tool:disabled:hover{background:transparent}

/* ------------------------------------------------------------ who is here */
.who-strip{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;min-width:0}
.who-strip .p{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;color:var(--slate);white-space:nowrap}
.who-strip .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--slate);flex:none;box-shadow:0 0 0 0 rgba(100,255,218,.5)}
.who-strip .p.on .dot{background:var(--accent);animation:pulse 2.4s ease-out infinite}
.who-strip .p.on{color:var(--lightest)}
.who-strip .p.self b{color:var(--accent)}
.who-strip .p b{font-weight:600;color:inherit}
.who-strip .p .ago{font-size:.76rem;color:var(--slate)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(100,255,218,.45)}70%{box-shadow:0 0 0 .4rem rgba(100,255,218,0)}100%{box-shadow:0 0 0 0 rgba(100,255,218,0)}}
@media (prefers-reduced-motion:reduce){.who-strip .p.on .dot{animation:none}}

/* -------------------------------------------------------------- gif picker */
.gifbox{margin-top:.7rem;border:1px solid rgba(100,255,218,.25);border-radius:10px;background:#050d18;overflow:hidden}
.gifsearch{display:flex;gap:.5rem;padding:.6rem}
.gifsearch input{flex:1;min-width:0;background:var(--navy);border:1px solid rgba(100,255,218,.2);border-radius:8px;color:var(--white);font-family:inherit;font-size:1rem;padding:.55rem .7rem}
.gifsearch input:focus{outline:none;border-color:var(--accent)}
.gifsearch button{background:transparent;border:1px solid rgba(136,146,176,.35);color:var(--slate);border-radius:8px;font-size:1.1rem;padding:0 .7rem;cursor:pointer;font-family:inherit;line-height:1}
.gifgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.45rem;padding:0 .6rem .6rem;max-height:230px;overflow-y:auto}
.gifgrid img{width:100%;height:90px;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--navy);border:1px solid transparent}
.gifgrid img:hover{border-color:var(--accent)}
.gifnote{grid-column:1/-1;color:var(--slate);font-size:.85rem;padding:.4rem .2rem;line-height:1.5}

.thread{flex:1;overflow-y:auto;padding:1.15rem 1.15rem 3rem}
.msg{background:var(--navy);border:1px solid rgba(136,146,176,.18);border-left:3px solid var(--slate);border-radius:0 10px 10px 0;padding:.75rem .95rem;margin-bottom:.85rem}
.msg.mine{border-left-color:var(--accent)}
.msg .who{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.3rem}
.msg .who b{color:var(--lightest);font-size:.88rem;font-weight:600}
.msg.mine .who b{color:var(--accent)}
.msg .who time{color:var(--slate);font-size:.76rem;white-space:nowrap}
.msg p{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;color:var(--light)}
.msg a{color:var(--bright)}
.msg.broken{border-left-color:var(--gold)}
.msg.broken p{color:var(--gold);font-style:italic}
.msg .shot{display:block;margin-top:.5rem;line-height:0}
.msg .shot img{max-width:100%;height:auto;border-radius:8px;border:1px solid rgba(136,146,176,.25);background:#050d18}
.msg .attach{display:inline-block;margin-top:.5rem;background:rgba(100,255,218,.08);border:1px solid rgba(100,255,218,.3);color:var(--accent);border-radius:8px;padding:.5rem .8rem;font-size:.88rem;text-decoration:none;line-height:1.4}
.msg .attach:hover{background:rgba(100,255,218,.16)}
.empty{color:var(--slate);text-align:center;padding:2.5rem 1rem;font-size:.95rem}

/* ------------------------------------------------------------ voice notes */
/* Native controls, deliberately. A hand-built player would have to reimplement
   scrubbing, the lock-screen handoff and the "another sound started, stop this
   one" behaviour that the browser already gets right, and it would still be a
   worse tap target on a phone than the one the OS ships. */
.msg .voice{display:flex;align-items:center;gap:.6rem;margin-top:.55rem;flex-wrap:wrap}
/* Width is constrained, height deliberately is not -- every browser sizes its
   own control strip, and forcing a height clips the buttons on some of them. */
.msg .voice audio{flex:1;min-width:200px;max-width:340px}
.msg .voice .vlen{color:var(--slate);font-size:.8rem;font-variant-numeric:tabular-nums;flex:none}

/* ------------------------------------------------------------- reactions */
/* display:contents so the pills are laid out by .rxrow's flex, even though
   they live in their own box -- that box gets its innerHTML replaced on every
   repaint, and the picker beside it must survive that. */
.msg .rxrow{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;margin-top:.55rem}
.msg .rx{display:contents}
.pill{display:inline-flex;align-items:center;gap:.3rem;background:rgba(136,146,176,.12);border:1px solid rgba(136,146,176,.32);color:var(--light);border-radius:999px;padding:.18rem .55rem;font-size:.95rem;line-height:1.25;cursor:pointer;font-family:inherit}
.pill:hover{border-color:var(--accent)}
.pill.mine{background:rgba(100,255,218,.14);border-color:rgba(100,255,218,.5)}
.pill .n{font-size:.74rem;color:var(--slate);font-variant-numeric:tabular-nums}
.pill.mine .n{color:var(--accent)}
.addrx{background:transparent;border:1px dashed rgba(136,146,176,.4);color:var(--slate);border-radius:999px;padding:.18rem .5rem;font-size:.85rem;line-height:1.25;cursor:pointer;font-family:inherit}
.addrx:hover{color:var(--accent);border-color:var(--accent)}
.rxpick{flex-basis:100%;display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.rxpick button{background:var(--navy-dark);border:1px solid rgba(100,255,218,.3);border-radius:8px;font-size:1.15rem;line-height:1;padding:.35rem .5rem;cursor:pointer;font-family:inherit}
.rxpick button:hover{background:rgba(100,255,218,.14)}

/* ------------------------------------------------------------- recording */
.rec{display:flex;align-items:center;gap:.7rem;margin-top:.6rem;background:rgba(249,168,37,.08);border:1px solid rgba(249,168,37,.45);border-radius:10px;padding:.6rem .8rem;flex-wrap:wrap}
.rec .live{width:.6rem;height:.6rem;border-radius:50%;background:var(--gold);flex:none;animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec .live{animation:none}}
.rec .t{color:var(--gold);font-family:ui-monospace,Consolas,monospace;font-size:1rem;font-variant-numeric:tabular-nums;flex:none}
.rec .rhint{color:var(--light);font-size:.84rem;flex:1;min-width:0}
.rec button{border-radius:8px;font-size:.9rem;font-weight:700;padding:.45rem 1rem;cursor:pointer;font-family:inherit;border:1px solid rgba(100,255,218,.4);background:transparent;color:var(--accent);flex:none}
.rec button#recStop{background:var(--accent);color:#08131f;border-color:var(--accent)}
.rec button#recCancel{border-color:rgba(136,146,176,.4);color:var(--slate)}

/* ------------------------------------------------------------------ emoji */
.emojibox{margin-top:.6rem;background:var(--navy);border:1px solid rgba(100,255,218,.25);border-radius:10px;padding:.5rem}
.emojigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:.15rem;max-height:190px;overflow-y:auto}
.emojigrid button{border:none;background:transparent;font-size:1.35rem;line-height:1;padding:.35rem 0;border-radius:8px;cursor:pointer;font-family:inherit}
.emojigrid button:hover,.emojigrid button:focus-visible{background:rgba(100,255,218,.15)}

/* ------------------------------------------------------------ incoming call */
/* Same shape as .rec on purpose -- both are "something is live right now, and
   you have two ways out of it", and they never appear at the same time. */
.ring{display:flex;align-items:center;gap:.7rem;margin-top:.6rem;background:rgba(100,255,218,.09);border:1px solid rgba(100,255,218,.5);border-radius:10px;padding:.6rem .8rem;flex-wrap:wrap}
.ring .live{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);flex:none;animation:blink 1.1s steps(2,start) infinite}
@media (prefers-reduced-motion:reduce){.ring .live{animation:none}}
.ring .rhint{color:var(--white);font-size:.9rem;font-weight:600;flex:1;min-width:0}
.ring button{border-radius:8px;font-size:.9rem;font-weight:700;padding:.45rem 1rem;cursor:pointer;font-family:inherit;border:1px solid rgba(100,255,218,.4);background:transparent;color:var(--accent);flex:none}
.ring button#ringAccept{background:var(--accent);color:#08131f;border-color:var(--accent)}
.ring button#ringDecline{border-color:rgba(136,146,176,.4);color:var(--slate)}

/* ------------------------------------------------------------------- call */
.callwrap{position:fixed;inset:0;z-index:900;background:#04070d;display:flex;flex-direction:column}
.callstage{position:relative;flex:1;min-height:0;background:#04070d}
/* contain, not cover: a face cropped by the viewport is worse than letterboxing. */
.callstage .remote{width:100%;height:100%;object-fit:contain;background:#04070d;display:block}
/* Self-view is a thumbnail and mirrored, because everyone expects a mirror of
   themselves and nobody expects a mirror of the other person. */
.callstage .local{position:absolute;right:.9rem;bottom:.9rem;width:29vw;max-width:190px;border-radius:10px;border:1px solid rgba(100,255,218,.35);object-fit:cover;transform:scaleX(-1);background:#0a192f;box-shadow:0 6px 22px rgba(0,0,0,.5)}
.callstate{position:absolute;top:1rem;left:0;right:0;text-align:center;color:var(--light);font-size:.9rem;pointer-events:none;text-shadow:0 1px 6px #000}
.callbar{flex:none;display:flex;justify-content:center;gap:1rem;padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom));background:#08131f;border-top:1px solid rgba(100,255,218,.15)}
/* 52px, not the 34px the composer tools use: these are hit while holding a
   phone one-handed, and one of them hangs up on your son. */
.cbtn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(100,255,218,.4);background:transparent;color:var(--accent);font-size:1.2rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.cbtn[aria-pressed="true"]{background:rgba(136,146,176,.25);color:var(--slate);border-color:rgba(136,146,176,.5)}
.cbtn.end{width:auto;padding:0 1.4rem;border-radius:26px;background:#c0392b;border-color:#c0392b;color:#fff;font-weight:700;font-size:.95rem}
@media (max-width:560px){.callstage .local{width:34vw}}

/* ----------------------------------------------------------------- rail */
.side{flex:none;width:290px;border-left:1px solid rgba(100,255,218,.15);overflow-y:auto;padding:1.15rem 1.1rem 3rem}
.side h2{color:var(--slate);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:.9rem}
.file{background:var(--navy);border:1px solid rgba(100,255,218,.15);border-radius:10px;padding:.8rem .9rem;margin-bottom:.7rem}
.file .name{display:block;color:var(--accent);font-weight:600;font-size:.95rem;text-decoration:none;line-height:1.35}
.file .name:hover{color:var(--bright);text-decoration:underline}
.file .meta{color:var(--slate);font-size:.75rem;margin-top:.15rem}
.file .note{color:var(--light);font-size:.84rem;margin-top:.45rem;line-height:1.5}
.file .pw{margin-top:.45rem;font-size:.8rem;color:var(--slate)}
.file .pw b{color:var(--gold);font-family:ui-monospace,Consolas,monospace;font-size:1rem;letter-spacing:.06em}
.side .none{color:var(--slate);font-size:.85rem;line-height:1.6}
.file .tag{display:inline-block;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;padding:.1rem .4rem;border-radius:4px;margin-left:.4rem;vertical-align:.1em;border:1px solid rgba(136,146,176,.4);color:var(--slate)}
.file .tag.pub{border-color:rgba(249,168,37,.5);color:var(--gold)}

.upload{margin-top:.9rem}
.pick{display:block;text-align:center;border:1px dashed rgba(100,255,218,.35);color:var(--accent);border-radius:10px;padding:.7rem;font-size:.88rem;font-weight:600;cursor:pointer}
.pick:hover{background:rgba(100,255,218,.08)}
.pick.busy{opacity:.5;cursor:default}
.uhint{color:var(--slate);font-size:.75rem;margin-top:.45rem;line-height:1.5}

details.how{margin-top:1.4rem;border-top:1px solid rgba(100,255,218,.15);padding-top:1rem}
details.how summary{cursor:pointer;color:var(--slate);font-size:.83rem;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"\25B8\00a0"}
details.how[open] summary::before{content:"\25BE\00a0"}
details.how summary:hover{color:var(--accent)}
.how h3{color:var(--white);font-size:.92rem;margin:1.1rem 0 .4rem}
.how p{margin-bottom:.7rem;color:var(--light);font-size:.85rem;line-height:1.6}
.how ol,.how ul{margin:0 0 .8rem 1.1rem}
.how li{margin-bottom:.35rem;color:var(--light);font-size:.85rem;line-height:1.55}
.how strong{color:var(--white)}
.how pre{background:#050d18;border:1px solid rgba(100,255,218,.2);border-radius:8px;padding:.7rem;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.68rem;color:var(--lightest);line-height:1.5;white-space:pre-wrap;word-break:break-all;margin-bottom:.6rem}
.how button.copy{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:.4rem .8rem;border-radius:6px;font-size:.78rem;cursor:pointer;font-weight:600;font-family:inherit}
.how button.copy:hover{background:rgba(100,255,218,.12)}
.how .small{font-size:.78rem;color:var(--slate)}
.warn{border-left:3px solid var(--gold);background:rgba(249,168,37,.08);padding:.7rem .85rem;border-radius:0 6px 6px 0;margin:.8rem 0}
.warn p{margin:0;font-size:.82rem}

/* --------------------------------------------------------------- narrow */
@media (max-width:860px){
  #filesToggle{display:inline-block}
  .cols{flex-direction:column}
  .side{width:auto;border-left:none;border-top:1px solid rgba(100,255,218,.15);display:none;flex:none;max-height:55%}
  .side.open{display:block}
  .bar{padding:.7rem .85rem;gap:.6rem;align-items:flex-start}
  .bar nav{flex-wrap:wrap;justify-content:flex-end;gap:.35rem}
  .bar a,.bar button{font-size:.78rem;padding:.3rem .55rem}
  .thread,.compose{padding-left:.85rem;padding-right:.85rem}
  .who-strip{gap:.75rem}
  .who-strip .p{font-size:.82rem}

  /* Safari zooms the whole page when a focused field is under 16px, and never
     zooms back out. Every input the thumb can reach is therefore >=16px. */
  .compose textarea,.gifsearch input{font-size:16px}
  .pin{font-size:1.6rem}

  /* Room for the home indicator and the notch, without hardcoding a guess. */
  .thread{padding-bottom:calc(2.5rem + env(safe-area-inset-bottom))}
  .compose{padding-bottom:calc(1rem + env(safe-area-inset-bottom)/2)}
  .bar{padding-top:calc(.7rem + env(safe-area-inset-top))}
  .side{padding-bottom:calc(3rem + env(safe-area-inset-bottom))}

  /* The composer stacks so the buttons keep a full-width tap target. */
  .crow{gap:.6rem}
  .crow .hint{flex-basis:100%;order:2}
  .tools{order:1;width:100%;justify-content:space-between}
  .tools #send{flex:1;margin-left:.3rem}
  button.tool{padding:.65rem .9rem}
  .gifgrid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));max-height:40vh}

  /* Thumb-sized targets. A reaction pill at desktop size is a 20px-tall thing
     to hit while walking, which is how it will mostly be used. */
  .pill,.addrx{padding:.35rem .7rem;font-size:1rem}
  .rxpick button{padding:.5rem .7rem;font-size:1.3rem}
  .msg .voice audio{min-width:0;max-width:none;width:100%}
  .rec .rhint{flex-basis:100%;order:3}
  .rec button{flex:1}
}

/* Safe-area padding applies at EVERY width, not just phone-width. An installed
   iPad is wider than the breakpoint above and still has insets, and on any
   device without a notch these evaluate to zero and cost nothing. Paired with
   viewport-fit=cover in the <head>, without which they are all zero anyway. */
.bar{padding-top:calc(.85rem + env(safe-area-inset-top));
     padding-left:calc(1.15rem + env(safe-area-inset-left));
     padding-right:calc(1.15rem + env(safe-area-inset-right))}
.thread{padding-bottom:calc(3rem + env(safe-area-inset-bottom))}
.compose{padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
.gate{padding-top:calc(1.5rem + env(safe-area-inset-top));
      padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))}

/* --------------------------------------------------- the notification notice */
/* A one-line hint under the composer is the wrong place to explain a multi-step
   iOS procedure -- on a phone it is small, easy to miss, and gets overwritten
   by the next status message. This says it where it cannot be missed. */
.notice{background:rgba(249,168,37,.1);border:1px solid rgba(249,168,37,.45);border-radius:10px;padding:.9rem 1rem;margin-bottom:1rem}
.notice h3{color:var(--gold);font-size:.95rem;margin-bottom:.5rem}
.notice ol{margin:0 0 .3rem 1.15rem}
.notice li{color:var(--light);font-size:.9rem;margin-bottom:.35rem;line-height:1.5}
.notice p{color:var(--light);font-size:.88rem;margin-bottom:.4rem}
.notice strong{color:var(--white)}
.notice button{background:transparent;border:1px solid rgba(249,168,37,.5);color:var(--gold);font-size:.8rem;padding:.3rem .7rem;border-radius:6px;cursor:pointer;font-family:inherit;margin-top:.4rem}

/* Touch devices: nothing here should depend on a hover state existing. */
@media (hover:none){
  .file .name:hover,.bar button:hover,.pick:hover{text-decoration:none}
  .thread{-webkit-overflow-scrolling:touch}
}
</style>
</head>
<body>

<!-- Locked. Says nothing about who or what. -->
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <label for="pin">Enter your PIN</label>
    <input class="pin" id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*"
           autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" aria-describedby="gateErr">
    <button type="submit" id="gateGo">Enter</button>
    <div class="err" id="gateErr" role="alert" aria-live="polite"></div>
  </form>
</div>

<!-- Unlocked. -->
<div class="app" id="app">
  <div class="bar">
    <!-- Who is here. Both people, always, in the same order for both of us. -->
    <div class="who-strip" id="whoStrip" aria-live="polite"></div>
    <nav>
      <button type="button" id="notifyBtn" hidden>Notifications</button>
      <button type="button" id="filesToggle" aria-expanded="false" aria-controls="side">Files</button>
      <button type="button" id="exportBtn">Save a copy</button>
      <button type="button" id="signOut">Sign out</button>
    </nav>
  </div>

  <div class="cols">
    <div class="main">
      <div class="compose">
        <textarea id="text" placeholder="Write something&hellip;" maxlength="4000" aria-label="Your message"></textarea>
        <div class="crow">
          <span class="hint" id="hint">Enter sends &middot; Shift+Enter for a new line</span>
          <div class="tools">
            <button type="button" class="tool" id="callBtn" title="Start a video call" aria-label="Start a video call">&#128249;</button>
            <button type="button" class="tool" id="micBtn" title="Send a voice message" aria-label="Send a voice message">&#127908;</button>
            <button type="button" class="tool" id="photoBtn" title="Send a photo" aria-label="Send a photo">&#128247;</button>
            <button type="button" class="tool" id="emojiBtn" title="Insert an emoji" aria-label="Insert an emoji" aria-expanded="false">&#128512;</button>
            <button type="button" class="tool" id="gifBtn" title="Send a GIF" aria-label="Send a GIF">GIF</button>
            <button type="button" id="send">Send</button>
          </div>
        </div>

        <!-- Only while the microphone is live. Nothing is sent until Send is
             pressed, and Cancel throws the recording away without it ever
             leaving the device. -->
        <div class="rec" id="recBar" hidden>
          <span class="live" aria-hidden="true"></span>
          <span class="t" id="recTime" role="timer" aria-live="off">0:00</span>
          <span class="rhint" id="recHint">Recording&hellip;</span>
          <button type="button" id="recStop">Send</button>
          <button type="button" id="recCancel">Cancel</button>
        </div>

        <!-- Incoming call. Deliberately a bar rather than a modal: a modal that
             steals focus while you are mid-sentence is worse than a ringing
             phone, and declining has to be as easy as ignoring it. -->
        <div class="ring" id="ringBar" hidden>
          <span class="live" aria-hidden="true"></span>
          <span class="rhint" id="ringWho">Incoming call</span>
          <button type="button" id="ringAccept">Answer</button>
          <button type="button" id="ringDecline">Decline</button>
        </div>

        <input type="file" id="photoPick" accept="image/*" hidden>
        <input type="file" id="gifPick" accept="image/gif" hidden>
        <!-- The fallback when this browser cannot record: pick a sound file
             that already exists. On iOS this reaches Voice Memos. -->
        <input type="file" id="audioPick" accept="audio/*" hidden>

        <!-- Emoji. A fixed local set rather than a picker library: every
             character here is already in the font the page renders with, so
             there is nothing to fetch and nothing that can be swapped out.
             Filled by script from EMOJI so the markup stays short. -->
        <div class="emojibox" id="emojiBox" hidden>
          <div class="emojigrid" id="emojiGrid" role="listbox" aria-label="Emoji"></div>
        </div>

        <!-- GIF search. Hidden until asked for; the query goes to GIPHY, the
             chosen GIF is re-stored by us so viewing it later leaks nothing. -->
        <div class="gifbox" id="gifBox" hidden>
          <div class="gifsearch">
            <input type="text" id="gifQ" placeholder="Search GIFs&hellip;" autocomplete="off" aria-label="Search GIFs">
            <button type="button" id="gifClose" aria-label="Close GIF search">&times;</button>
          </div>
          <div class="gifgrid" id="gifGrid"><p class="gifnote" id="gifNote">Type to search.</p></div>
        </div>
      </div>
      <div class="thread" id="thread">
        <div class="notice" id="notice" hidden></div>
        <div class="empty" id="empty">Loading&hellip;</div>
      </div>
    </div>

    <!-- The call surface. Fixed and above everything, because a call is the
         only thing on this page that is worth interrupting the thread for.
         playsinline on both videos is not optional: without it iOS takes the
         remote stream fullscreen on play and the controls below go unreachable. -->
    <div class="callwrap" id="callWrap" hidden>
      <div class="callstage">
        <video id="remoteVid" class="remote" autoplay playsinline></video>
        <video id="localVid" class="local" autoplay playsinline muted></video>
        <div class="callstate" id="callState">Connecting&hellip;</div>
      </div>
      <div class="callbar">
        <button type="button" class="cbtn" id="micTgl" aria-pressed="false" title="Mute microphone">&#127908;</button>
        <button type="button" class="cbtn" id="camTgl" aria-pressed="false" title="Turn camera off">&#128247;</button>
        <button type="button" class="cbtn end" id="callEnd" title="End call">End</button>
      </div>
    </div>

    <aside class="side" id="side">
      <h2>Files</h2>
      <!-- Populated from /api/jesse/files. Nothing is listed here in the markup,
           because the markup is public and the file list is not. -->
      <div id="fileList"><p class="none">Loading&hellip;</p></div>

      <div class="upload">
        <label class="pick" for="pick" id="pickLabel">Send a file</label>
        <input type="file" id="pick" hidden>
        <div class="uhint" id="uhint">Encrypted, and never touches the public repo.</div>
      </div>

    </aside>
  </div>
</div>

<script>
(function () {
  'use strict';

  var API = '/api/jesse/';
  var POLL_MS = 6000;

  // The service worker is registered at its own scope, NOT the '/' it would
  // default to. See the header comment in jesse-sw.js for what sharing a scope
  // with the other thread broke. SW_SCOPE also matches /jesse.html, since scope
  // is a string prefix.
  var SW_FILE = '/jesse-sw.js';
  var SW_SCOPE = '/jesse';
  var TAG = 'jesse-thread';
  var ICON = '/private-icon-192.png';
  var BADGE = '/private-badge-96.png';

  /**
   * Whether a notification may quote the message.
   *
   * Off, to match what the server sends. notifyOther() in jesse-api.mjs sends
   * who and not what, on the reasoning that a lock screen is a more public
   * place than a thread behind a PIN. The in-page notification below used to
   * quote 120 characters, which for most real messages is the whole thing -- it
   * got away with it only because the API call it used throws on Android and on
   * iOS, so on a phone it had never actually fired. It fires now, so it follows
   * the same rule. Flip this to true to get previews back on desktop.
   */
  var PREVIEW_TEXT = false;

  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var gateForm = document.getElementById('gateForm');
  var pinInput = document.getElementById('pin');
  var gateGo = document.getElementById('gateGo');
  var gateErr = document.getElementById('gateErr');
  var thread = document.getElementById('thread');
  var empty = document.getElementById('empty');
  var textArea = document.getElementById('text');
  var sendBtn = document.getElementById('send');
  var hint = document.getElementById('hint');
  var side = document.getElementById('side');
  var fileList = document.getElementById('fileList');
  var filesToggle = document.getElementById('filesToggle');
  var pick = document.getElementById('pick');
  var pickLabel = document.getElementById('pickLabel');
  var uhint = document.getElementById('uhint');
  var whoStrip = document.getElementById('whoStrip');
  var notifyBtn = document.getElementById('notifyBtn');
  var notice = document.getElementById('notice');
  var photoBtn = document.getElementById('photoBtn');
  var photoPick = document.getElementById('photoPick');
  var gifBtn = document.getElementById('gifBtn');
  var gifBox = document.getElementById('gifBox');
  var gifQ = document.getElementById('gifQ');
  var gifGrid = document.getElementById('gifGrid');
  var gifNote = document.getElementById('gifNote');
  var gifClose = document.getElementById('gifClose');
  var micBtn = document.getElementById('micBtn');
  var audioPick = document.getElementById('audioPick');
  var recBar = document.getElementById('recBar');
  var recTime = document.getElementById('recTime');
  var recHint = document.getElementById('recHint');
  var recStop = document.getElementById('recStop');
  var recCancel = document.getElementById('recCancel');

  var me = null;          // 'dad' | 'jesse'
  var latestKey = null;   // newest key already rendered; drives incremental polls
  var rendered = 0;
  var timer = null;
  var maxUpload = 4 * 1024 * 1024;  // replaced by the server's real limit on load

  /**
   * The reaction set, mirroring REACTIONS in jesse-api.mjs.
   *
   * The server validates against its own copy and this one is only for drawing,
   * so a drift between them cannot let anything unexpected be stored -- it would
   * just mean a reaction that will not render. Change one, change the other.
   */
  var RX = [
    ['heart', '❤️'],
    ['up', '👍'],
    ['haha', '😂'],
    ['wow', '😮'],
    ['fire', '🔥'],
    ['sad', '😢']
  ];
  var RX_EMOJI = {};
  RX.forEach(function (r) { RX_EMOJI[r[0]] = r[1]; });

  var reactions = {};     // message key -> { code: [who, ...] }, whole thread
  var names = {};         // 'dad' -> 'Dad', filled from the presence list

  function api(path, opts) {
    return fetch(API + path, Object.assign({
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store'
    }, opts || {})).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'parse' }; })
        .then(function (body) { body._status = r.status; return body; });
    });
  }

  // -------------------------------------------------------------- rendering

  function stamp(ts) {
    var d = new Date(ts);
    var sameDay = d.toDateString() === new Date().toDateString();
    var time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return sameDay ? time : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + time;
  }

  /**
   * Message bodies become text nodes, never HTML. Links are turned into real
   * anchor elements by splitting the string and building nodes, so there is no
   * path by which message content can become markup.
   */
  function bodyInto(p, text) {
    var re = /(https?:\/\/[^\s<>"']+)/g;
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) p.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');
      a.href = m[1];
      a.textContent = m[1];
      a.rel = 'noopener noreferrer nofollow';
      a.target = '_blank';
      p.appendChild(a);
      last = m.index + m[1].length;
    }
    if (last < text.length) p.appendChild(document.createTextNode(text.slice(last)));
  }

  function node(msg) {
    var div = document.createElement('div');
    div.className = 'msg' + (msg.who === me ? ' mine' : '') + (msg.unreadable ? ' broken' : '');
    div.setAttribute('data-key', msg.key);

    var head = document.createElement('div');
    head.className = 'who';
    var b = document.createElement('b');
    b.textContent = msg.who === me ? 'You' : msg.name;
    var t = document.createElement('time');
    t.textContent = stamp(msg.ts);
    t.dateTime = new Date(msg.ts).toISOString();
    head.appendChild(b);
    head.appendChild(t);

    div.appendChild(head);

    if (msg.unreadable) {
      // Rule 1: a message we cannot decrypt is still shown to exist.
      var warn = document.createElement('p');
      warn.textContent = 'This message could not be decrypted. It is still stored — nothing was lost.';
      div.appendChild(warn);
    } else if (msg.text) {
      var p = document.createElement('p');
      bodyInto(p, msg.text);
      div.appendChild(p);
    }

    // An image sent into the thread is shown in the thread. The src is the
    // authenticated endpoint -- the browser sends the session cookie with it,
    // so the picture loads for us and 401s for anyone else. It is stored
    // encrypted in Netlify Blobs and never enters the public repository.
    if (msg.att) {
      var href = API + 'file?name=' + encodeURIComponent(msg.att.file);
      if (msg.att.audio) {
        // Played in place. The src is the same authenticated endpoint the
        // pictures use, so the sound is no more reachable than they are, and
        // the server answers byte ranges because Safari will not start a sound
        // file without them.
        var voice = document.createElement('div');
        voice.className = 'voice';
        var audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = href;
        voice.appendChild(audio);
        if (msg.att.secs) {
          var vlen = document.createElement('span');
          vlen.className = 'vlen';
          vlen.textContent = clock(msg.att.secs);
          voice.appendChild(vlen);
        }
        audio.addEventListener('error', function () {
          // Same rule as a picture that will not load: say so, and leave a way
          // to get at the file rather than a silent dead player.
          var fall = document.createElement('a');
          fall.className = 'attach';
          fall.href = href;
          fall.setAttribute('download', msg.att.name);
          fall.textContent = '⬇ ' + msg.att.name + ' — this browser cannot play it. Tap to download.';
          voice.replaceChild(fall, audio);
        });
        div.appendChild(voice);
      } else if (msg.att.image) {
        var link = document.createElement('a');
        link.href = href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'shot';
        var img = document.createElement('img');
        img.src = href;
        img.alt = msg.att.name;
        img.loading = 'lazy';
        img.addEventListener('error', function () {
          // Never leave a broken-image icon with no explanation.
          var oops = document.createElement('div');
          oops.className = 'attach';
          oops.textContent = msg.att.name + ' — could not be displayed. Tap to download.';
          link.replaceChild(oops, img);
        });
        link.appendChild(img);
        div.appendChild(link);
      } else {
        var a2 = document.createElement('a');
        a2.className = 'attach';
        a2.href = href;
        a2.setAttribute('download', msg.att.name);
        a2.textContent = '⬇ ' + msg.att.name + ' · ' + size(msg.att.size || 0);
        div.appendChild(a2);
      }
    }

    // The reaction row is built empty and filled by paintReactions(), which runs
    // on every poll. It has to work that way round: a reaction can land on a
    // message that has been on screen since last week, and the incremental
    // message cursor will never mention that message again.
    var rxrow = document.createElement('div');
    rxrow.className = 'rxrow';

    var rx = document.createElement('div');
    rx.className = 'rx';
    rxrow.appendChild(rx);

    var addrx = document.createElement('button');
    addrx.type = 'button';
    addrx.className = 'addrx';
    addrx.textContent = '☺ +';
    addrx.title = 'React';
    addrx.setAttribute('aria-label', 'React to this message');
    addrx.setAttribute('aria-expanded', 'false');
    rxrow.appendChild(addrx);

    var pickBox = document.createElement('div');
    pickBox.className = 'rxpick';
    pickBox.hidden = true;
    RX.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-code', r[0]);
      b.textContent = r[1];
      b.setAttribute('aria-label', 'React ' + r[1]);
      pickBox.appendChild(b);
    });
    rxrow.appendChild(pickBox);

    div.appendChild(rxrow);

    return div;
  }

  /**
   * Newest first, so new arrivals go on top.
   *
   * Skips anything already on screen, matched on the message key that node()
   * writes to data-key. Your own message is rendered immediately from the send
   * response AND arrives again in the next poll; without this it appears twice.
   * The dedupe is what makes it safe to leave the poll cursor alone below.
   */
  function add(messages) {
    if (!messages || !messages.length) return;
    var frag = document.createDocumentFragment();
    var added = 0;
    messages.forEach(function (m) {
      if (!m || !m.key) return;
      if (thread.querySelector('[data-key="' + m.key.replace(/"/g, '\\"') + '"]')) return;
      frag.appendChild(node(m));
      added++;
    });
    if (!added) return;
    thread.insertBefore(frag, thread.firstChild);
    rendered += added;
    if (empty.parentNode) empty.parentNode.removeChild(empty);
  }

  // ------------------------------------------------------------- reactions

  /**
   * Repaint every visible message's reaction row from the whole-thread map.
   *
   * Guarded by a signature per row, because this runs every six seconds against
   * up to two hundred messages and almost every run has nothing to do. Without
   * it, a poll would rebuild hundreds of buttons -- and destroy whichever one
   * was under a thumb at the time.
   */
  function paintReactions() {
    var rows = thread.querySelectorAll('.msg[data-key]');
    for (var i = 0; i < rows.length; i++) {
      var msgEl = rows[i];
      var box = msgEl.querySelector('.rx');
      if (!box) continue;
      var have = reactions[msgEl.getAttribute('data-key')] || {};

      var sig = RX.map(function (r) { return r[0] + ':' + ((have[r[0]] || []).slice().sort().join(',')); }).join('|');
      if (box.getAttribute('data-sig') === sig) continue;
      box.setAttribute('data-sig', sig);
      box.textContent = '';

      RX.forEach(function (r) {
        var who = have[r[0]] || [];
        if (!who.length) return;
        var mine = who.indexOf(me) > -1;
        var pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'pill' + (mine ? ' mine' : '');
        pill.setAttribute('data-code', r[0]);
        pill.appendChild(document.createTextNode(r[1]));
        if (who.length > 1) {
          var n = document.createElement('span');
          n.className = 'n';
          n.textContent = String(who.length);
          pill.appendChild(n);
        }
        // Who reacted, spelled out -- with two people a count alone does not
        // say which of them it was.
        var listed = who.map(function (w) { return w === me ? 'You' : (names[w] || w); }).join(' and ');
        pill.title = listed + (mine ? ' — tap to take yours back' : ' — tap to add yours');
        pill.setAttribute('aria-label', listed + ' reacted ' + r[1]);
        box.appendChild(pill);
      });
    }
  }

  function react(key, code) {
    api('react', { method: 'POST', body: JSON.stringify({ key: key, code: code }) })
      .then(function (r) {
        if (r._status === 401) { lock(); return; }
        // The server answers with the whole map rather than a delta, so this is
        // the same painting path a poll takes -- one way for the row to be
        // right, not two that can disagree.
        if (r.ok && r.reactions) { reactions = r.reactions; paintReactions(); }
      })
      .catch(function () { /* the next poll will show the truth either way */ });
  }

  function closePickers(except) {
    var open = thread.querySelectorAll('.rxpick');
    for (var i = 0; i < open.length; i++) {
      if (open[i] === except) continue;
      open[i].hidden = true;
      var btn = open[i].parentNode && open[i].parentNode.querySelector('.addrx');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  }

  /**
   * One delegated listener, because message nodes are created constantly and
   * binding three handlers to each of them would leak a little more with every
   * poll for as long as the tab stays open.
   */
  thread.addEventListener('click', function (e) {
    var target = e.target;

    var pill = target.closest ? target.closest('.pill') : null;
    if (pill) {
      var msgEl = pill.closest('.msg[data-key]');
      if (!msgEl) return;
      // Tapping your own reaction takes it back; tapping someone else's adds
      // yours alongside it. One person holds at most one reaction per message,
      // so picking a different one replaces it.
      react(msgEl.getAttribute('data-key'), pill.classList.contains('mine') ? 'none' : pill.getAttribute('data-code'));
      return;
    }

    var add = target.closest ? target.closest('.addrx') : null;
    if (add) {
      var box = add.parentNode.querySelector('.rxpick');
      if (!box) return;
      var opening = box.hidden;
      closePickers(box);
      box.hidden = !opening;
      add.setAttribute('aria-expanded', opening ? 'true' : 'false');
      return;
    }

    var choice = target.closest ? target.closest('.rxpick button[data-code]') : null;
    if (choice) {
      var owner = choice.closest('.msg[data-key]');
      if (!owner) return;
      react(owner.getAttribute('data-key'), choice.getAttribute('data-code'));
      closePickers(null);
    }
  });

  // ------------------------------------------------------------- who is here

  function ago(ts) {
    if (!ts) return 'not yet';
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 90) return 'just now';
    var m = Math.round(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  function drawPresence(list) {
    whoStrip.textContent = '';
    notice.hidden = true;
    (list || []).forEach(function (p) {
      // Reaction pills name whoever reacted, and this is where the page learns
      // that 'dad' is called Dad.
      names[p.id] = p.name;
      var el = document.createElement('span');
      el.className = 'p' + (p.online ? ' on' : '') + (p.id === me ? ' self' : '');
      var dot = document.createElement('span');
      dot.className = 'dot';
      var nm = document.createElement('b');
      nm.textContent = p.id === me ? p.name + ' (you)' : p.name;
      el.appendChild(dot);
      el.appendChild(nm);
      var state = document.createElement('span');
      state.className = 'ago';
      state.textContent = p.online ? 'online' : ago(p.lastSeen);
      el.appendChild(state);
      whoStrip.appendChild(el);
    });
  }

  function poll() {
    var q = latestKey ? '?after=' + encodeURIComponent(latestKey) : '';
    return api('messages' + q).then(function (r) {
      if (r._status === 401) { lock(); return; }
      if (!r.ok) return;
      if (r.presence) drawPresence(r.presence);
      var fresh = (r.messages || []).filter(function (m) { return m.who !== me; });
      add(r.messages || []);
      if (r.reactions) reactions = r.reactions;
      // After add(), so rows that arrived in this same poll get painted too.
      paintReactions();
      if (r.latestKey) latestKey = r.latestKey;
      if (!rendered && empty.parentNode) empty.textContent = 'Nothing here yet. Say something.';
      // Only nudge for messages from the other person, and only when this tab
      // is not the thing being looked at.
      if (fresh.length && document.visibilityState !== 'visible') localNotify(fresh);
    }).catch(function () { /* offline; the next tick tries again */ });
  }

  // --------------------------------------------------------- notifications

  /**
   * Two layers, because they cover different situations.
   *
   *   local  fires from this page while it is open. Instant, no setup.
   *   push   fires from the server through a service worker, so it arrives with
   *          the browser closed. That is the one that matters on a phone.
   *
   * On iPhone, web push only works once the page has been added to the Home
   * Screen -- Apple's rule, not ours -- so the button says so rather than
   * failing silently.
   */
  function localNotify(msgs) {
    if (!canNotify || Notification.permission !== 'granted') return;
    var m = msgs[msgs.length - 1];
    // Same shape the server uses in notifyOther() -- name in the title, what
    // they did in the body -- so the two collapse into one line under the
    // shared tag instead of reading as two different events.
    var what = m.att
      ? (m.att.audio ? 'sent a voice message' : m.att.image ? 'sent a photo' : 'sent a file')
      : 'sent a message';
    var body = PREVIEW_TEXT
      ? String(m.text || (m.att ? m.att.name : '')).slice(0, 120)
      : what;
    var title = m.name;
    var opts = { body: body, tag: TAG, icon: ICON, badge: BADGE, renotify: true };

    // Through the service worker where there is one. `new Notification()` does
    // not merely go unsupported on Android Chrome and on iOS -- it throws, and
    // the catch here used to swallow that, so on a phone this whole branch had
    // been doing nothing while looking exactly like it worked.
    if (canPush && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration(SW_SCOPE).then(function (reg) {
        if (!reg) throw new Error('not registered');
        return reg.showNotification(title, opts);
      }).catch(function () { constructNotification(title, opts); });
      return;
    }
    constructNotification(title, opts);
  }

  function constructNotification(title, opts) {
    try { new Notification(title, opts); } catch (e) { /* nothing left to try */ }
  }

  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  /**
   * iPadOS 13 and later removed "iPad" from the user agent -- an iPad reports
   * itself as a Macintosh. The old test therefore missed every iPad, which then
   * fell through to "this browser cannot show notifications, try Safari or
   * Chrome": a dead end, shown on one of the two devices that actually needed
   * the Add to Home Screen instructions. A desktop Mac reports maxTouchPoints
   * of 0, so the touch count is what separates the two.
   */
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  /**
   * Capabilities are tested, not inferred from the user agent. The user agent
   * is only ever consulted to explain a failure, never to predict one.
   *
   * Safari on iOS and iPadOS does not define Notification AT ALL until the page
   * has been added to the Home Screen, so its absence there means "not
   * installed yet", not "impossible". Everywhere else -- including Safari on a
   * desktop Mac, which is the case a UA sniff gets wrong -- a plain tab is fine.
   */
  var canNotify = 'Notification' in window;
  var canPush = 'serviceWorker' in navigator && 'PushManager' in window;
  var needsInstall = isIOS && !isStandalone && !canNotify;

  function urlB64ToUint8(b64) {
    var pad = '='.repeat((4 - (b64.length % 4)) % 4);
    var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  /**
   * Safari on iOS and iPadOS does not define Notification until the page has
   * been added to the Home Screen. The first version of this hid the button in
   * that case, which meant the one device that needed the instructions was the
   * one device that could not see them. Show it and say what to do instead.
   */
  function refreshNotifyBtn() {
    notifyBtn.hidden = false;
    notifyBtn.disabled = false;
    notifyBtn.title = '';

    if (needsInstall) {
      notifyBtn.textContent = 'Notifications: add to Home Screen';
      notifyBtn.title = 'On an iPhone or iPad, notifications only work once this page is installed.';
      return;
    }
    if (!canNotify) {
      notifyBtn.textContent = 'Notifications unsupported';
      notifyBtn.disabled = true;
      notifyBtn.title = 'This browser cannot show notifications.';
      return;
    }
    if (Notification.permission === 'granted') {
      notifyBtn.textContent = 'Notifications on';
      notifyBtn.disabled = true;
    } else if (Notification.permission === 'denied') {
      notifyBtn.textContent = 'Notifications blocked';
      notifyBtn.disabled = true;
      notifyBtn.title = 'Blocked for this site. Turn them back on via the padlock in the address bar.';
    } else {
      notifyBtn.textContent = 'Turn on notifications';
    }
  }

  /**
   * Both threads used to register their worker at the default scope of '/'.
   *
   * A registration is keyed by its scope, and the push subscription belongs to
   * the registration -- so on a browser signed in to both threads, whichever
   * page loaded second replaced the first one's worker while inheriting its
   * subscription, which was welded to the other thread's VAPID key. One thread's
   * notifications were then rejected by the push service outright, and the ones
   * that did arrive were handled by the wrong worker and opened the wrong page.
   *
   * Anyone who used the old build is still carrying that '/' registration.
   * Unsubscribe it before unregistering, so the server's stored copy dies with a
   * 410 on the next send instead of lingering as an endpoint no worker answers.
   *
   * The test is deliberately "one of our two workers, at neither of the two
   * scopes we now use" -- checking only for this page's scope would make /jesse
   * tear down the perfectly good /nicole registration and vice versa.
   */
  function clearLegacyRegistration() {
    if (!navigator.serviceWorker.getRegistrations) return Promise.resolve();
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.map(function (reg) {
        var worker = reg.active || reg.waiting || reg.installing;
        var script = (worker && worker.scriptURL) || '';
        if (!/\/(jesse|nicole)-sw\.js$/.test(script)) return null;
        if (reg.scope === location.origin + '/jesse' ||
            reg.scope === location.origin + '/nicole') return null;
        return reg.pushManager.getSubscription()
          .then(function (sub) { return sub && sub.unsubscribe(); })
          .catch(function () {})
          .then(function () { return reg.unregister(); })
          .catch(function () {});
      }));
    }).catch(function () { /* nothing to migrate, or no permission to look */ });
  }

  /**
   * A subscription is welded to the applicationServerKey it was created with.
   * If the server's key has moved on -- a regenerated blob, or a subscription
   * inherited from the other thread by the shared registration above -- every
   * send comes back 403 and nothing on this end would ever find out.
   *
   * Safari does not expose options.applicationServerKey at all. Treat "cannot
   * tell" as a match: tearing down and rebuilding the subscription on every
   * single load would be a worse bug than the one being guarded against.
   */
  function sameKey(actual, wanted) {
    if (!actual) return true;
    var a = new Uint8Array(actual);
    if (a.length !== wanted.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== wanted[i]) return false;
    return true;
  }

  /** navigator.serviceWorker.ready never rejects and never times out. If the
   *  worker fails to start, an unguarded wait on it hangs this whole chain in
   *  silence -- exactly the failure this function exists to avoid. */
  function readyWithin(reg, ms) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      navigator.serviceWorker.ready.then(function () {
        if (!settled) { settled = true; resolve(reg); }
      });
      setTimeout(function () {
        if (!settled) { settled = true; reject(new Error('the service worker did not start')); }
      }, ms);
    });
  }

  /**
   * Background push. Reports what went wrong rather than swallowing it -- the
   * first version caught every error silently, so "notifications don't work"
   * was indistinguishable from "notifications are working", which is a terrible
   * place to debug from.
   */
  function enablePush() {
    if (!canPush) {
      hint.textContent = 'Notifications will show while this page is open. This browser can’t do background ones.';
      return Promise.resolve();
    }
    return clearLegacyRegistration()
      .then(function () { return navigator.serviceWorker.register(SW_FILE, { scope: SW_SCOPE }); })
      .then(function (reg) { return readyWithin(reg, 15000); })
      .then(function (reg) {
        return api('push-key').then(function (k) {
          if (!k.ok || !k.publicKey) throw new Error('no key from server');
          var wanted = urlB64ToUint8(k.publicKey);
          return reg.pushManager.getSubscription()
            .then(function (existing) {
              if (!existing) return null;
              if (sameKey(existing.options && existing.options.applicationServerKey, wanted)) return existing;
              return existing.unsubscribe().catch(function () {}).then(function () { return null; });
            })
            .then(function (existing) {
              return existing || reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: wanted
              });
            })
            .then(function (sub) { return { subscription: sub, publicKey: k.publicKey }; });
        });
      })
      .then(function (payload) {
        return fetch(API + 'subscribe', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json(); });
      })
      .then(function (r) {
        if (r && r.ok) {
          hint.textContent = 'Notifications on — you’ll get them even with this closed.';
          notice.hidden = true;
        } else {
          showNotice('Half-on', [], 'Notifications will show while this page is open, but the background registration did not complete. Tap the button again, or reopen the page from the Home Screen icon.');
        }
        setTimeout(function () { hint.textContent = touchOnly ? 'Tap Send when you’re ready' : 'Enter sends · Shift+Enter for a new line'; }, 6000);
      })
      .catch(function (e) {
        // Local notifications still work; say exactly that rather than nothing.
        hint.textContent = 'Notifications on while this page is open. Background ones failed: ' + (e && e.message ? e.message : 'unknown');
      });
  }

  /**
   * Show a step list where it cannot be missed, at the top of the thread.
   * Everything is built as DOM nodes, never innerHTML.
   */
  function showNotice(title, steps, tail) {
    notice.textContent = '';
    var h = document.createElement('h3');
    h.textContent = title;
    notice.appendChild(h);
    if (steps && steps.length) {
      var ol = document.createElement('ol');
      steps.forEach(function (t) {
        var li = document.createElement('li');
        li.textContent = t;
        ol.appendChild(li);
      });
      notice.appendChild(ol);
    }
    if (tail) {
      var p = document.createElement('p');
      p.textContent = tail;
      notice.appendChild(p);
    }
    var close = document.createElement('button');
    close.type = 'button';
    close.textContent = 'Got it';
    close.addEventListener('click', function () { notice.hidden = true; });
    notice.appendChild(close);
    notice.hidden = false;
    thread.scrollTop = 0;
  }

  notifyBtn.addEventListener('click', function () {
    if (needsInstall) {
      showNotice(
        'One extra step on an iPhone or iPad',
        [
          'Open this page in Safari. Chrome, Edge and Firefox on an iPhone or iPad cannot do this part — Apple does not let them.',
          'Tap the Share button — the square with an arrow coming out of the top.',
          'Scroll down and tap "Add to Home Screen", then tap Add.',
          'Close Safari. Open this from the new icon on the Home Screen, not from Safari.',
          'Sign in again, then tap "Turn on notifications" one more time.'
        ],
        'Apple only lets a website send notifications once it has been added to the Home Screen. There is no way around it from this end. It also needs iOS or iPadOS 16.4 or newer.'
      );
      return;
    }
    if (!canNotify) {
      showNotice(
        isIOS ? 'This device can’t do notifications yet' : 'This browser can’t do notifications',
        [],
        isIOS
          ? 'The page is installed correctly, but this version of iOS or iPadOS is too old — web notifications need 16.4 or newer. Updating in Settings → General → Software Update will enable it.'
          : 'This browser has no notification support at all. A current Chrome, Edge, Firefox, Opera or Safari will do it.'
      );
      return;
    }
    hint.textContent = 'Asking your browser…';
    var ask;
    try { ask = Notification.requestPermission(); } catch (e) { ask = null; }
    // Older Safari only supports the callback form and returns undefined here.
    if (!ask || typeof ask.then !== 'function') {
      ask = new Promise(function (res) { Notification.requestPermission(res); });
    }
    ask.then(function (p) {
      refreshNotifyBtn();
      if (p === 'granted') { enablePush(); return; }
      if (p === 'denied') {
        showNotice('Notifications are blocked for this page', [], isIOS
          ? 'Open Settings on the phone, scroll to this app, and turn Notifications on. Safari will not ask again by itself.'
          : 'Click the padlock in the address bar, set Notifications to Allow, then reload and tap the button again.');
      } else {
        showNotice('No answer was given', [], 'The permission box was dismissed. Tap the button again and choose Allow.');
      }
    });
  });

  function startPolling() {
    stopPolling();
    timer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      poll();
      // Also drain call signalling. An incoming offer has to be noticed by the
      // ordinary poll, because the fast call poll does not start until there is
      // a call -- leaving it to the fast poll alone means the first offer is
      // never seen and the phone never rings.
      if (typeof drainSignals === 'function' && !callActive) drainSignals();
    }, POLL_MS);
  }
  function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }

  // ----------------------------------------------------------------- files

  function size(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function clock(secs) {
    var s = Math.max(0, Math.round(secs));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /**
   * Downloads go through the API so the session cookie is checked. The files
   * are not served from the publish directory at all -- there is no URL that
   * reaches them without a valid PIN.
   */
  function drawFiles(files) {
    fileList.textContent = '';
    if (!files.length) {
      var none = document.createElement('p');
      none.className = 'none';
      none.textContent = 'Nothing here right now.';
      fileList.appendChild(none);
      return;
    }
    files.forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'file';

      var a = document.createElement('a');
      a.className = 'name';
      a.href = API + 'file?name=' + encodeURIComponent(f.name);
      a.textContent = f.label;
      // Pictures and sound open for viewing and listening; everything else
      // downloads. Both are served inline by the API, so both play in a tab.
      if (f.image || f.audio) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      else { a.setAttribute('download', f.display || f.name); }
      card.appendChild(a);

      // A shipped file lives in the public repo. Say so plainly rather than
      // letting either of us assume everything in this rail is private.
      var tag = document.createElement('span');
      tag.className = 'tag' + (f.origin === 'shipped' ? ' pub' : '');
      tag.textContent = f.origin === 'shipped' ? 'in public repo' : 'encrypted';
      tag.title = f.origin === 'shipped'
        ? 'Committed to the public GitHub repo. Off siegestack.com, but downloadable from GitHub.'
        : 'Encrypted and stored outside the repo. Only reachable with a PIN.';
      a.appendChild(tag);

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (f.display || f.name) + ' · ' + size(f.size) + (f.from ? ' · from ' + f.from : '');
      card.appendChild(meta);

      if (f.note) {
        var note = document.createElement('div');
        note.className = 'note';
        note.textContent = f.note;
        card.appendChild(note);
      }
      if (f.password) {
        var pw = document.createElement('div');
        pw.className = 'pw';
        pw.appendChild(document.createTextNode('Password: '));
        var strong = document.createElement('b');
        strong.textContent = f.password;
        pw.appendChild(strong);
        card.appendChild(pw);
      }
      fileList.appendChild(card);
    });
  }

  function loadFiles() {
    return api('files').then(function (r) {
      if (r.ok) { maxUpload = r.maxUpload || maxUpload; drawFiles(r.files || []); }
    }).catch(function () { /* the rail is not worth an error state */ });
  }

  var IMAGE_RE = /\.(png|jpe?g|gif|webp|avif|heic|heif|bmp)$/i;

  /**
   * Shrink a photo before sending it.
   *
   * A phone camera produces 4-12 MB per shot, well over the server's limit, and
   * "too big" is a useless answer to a kid trying to send his dad a picture.
   * Anything over the threshold is re-drawn at a sane size and re-encoded as
   * JPEG.
   *
   * Resolves with the ORIGINAL file whenever it cannot do better: formats the
   * browser will not decode (HEIC outside Safari is the common one), a canvas
   * that comes back empty, or any error at all. Sending the original and maybe
   * hitting the size limit beats silently sending nothing.
   */
  function shrinkImage(file) {
    var MAX_EDGE = 2000, TRIGGER = 1200000;
    return new Promise(function (resolve) {
      if (!IMAGE_RE.test(file.name) || file.size <= TRIGGER || !window.createImageBitmap) return resolve(file);
      var done = false;
      var bail = function () { if (!done) { done = true; resolve(file); } };
      setTimeout(bail, 8000);   // never hang the send on a decode that stalls
      createImageBitmap(file).then(function (bmp) {
        var scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
        var w = Math.max(1, Math.round(bmp.width * scale));
        var h = Math.max(1, Math.round(bmp.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(bmp, 0, 0, w, h);
        c.toBlob(function (blob) {
          if (done) return;
          done = true;
          // Keep the original if the "shrunk" version somehow got bigger.
          if (!blob || blob.size >= file.size) return resolve(file);
          var renamed = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          resolve(new File([blob], renamed, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.85);
      }).catch(bail);
    });
  }

  /**
   * The file is POSTed as a raw body with the name in the query string. No
   * multipart, no base64 -- base64 would inflate it by a third and push more
   * files over the size limit for nothing.
   */
  /**
   * The one upload path. The rail's "Send a file", the composer's camera button
   * and the voice recorder all come through here, so a fix to one is a fix to
   * all three.
   *
   * `extra` carries anything only one caller knows -- today just the recorder's
   * `secs`, which the server clamps and treats as cosmetic.
   */
  function sendUpload(chosen, done, extra) {
    if (!chosen) return;
    done = done || function () {};
    extra = extra || {};

    pickLabel.classList.add('busy');
    pickLabel.textContent = 'Sending…';
    uhint.textContent = IMAGE_RE.test(chosen.name) && chosen.size > 1200000 ? 'Resizing…' : size(chosen.size);
    hint.textContent = 'Sending ' + chosen.name + '…';

    var reset = function (msg) {
      pickLabel.classList.remove('busy');
      pickLabel.textContent = 'Send a file';
      pick.value = '';
      uhint.textContent = msg;
      hint.textContent = touchOnly ? 'Tap Send when you’re ready' : 'Enter sends · Shift+Enter for a new line';
      done();
    };

    shrinkImage(chosen).then(function (file) {
      if (file.size > maxUpload) {
        reset('Too big — ' + size(file.size) + '. The limit is ' + size(maxUpload) + '.');
        return null;
      }
      if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(file.name)) {
        reset('Rename it first — letters, numbers, dots, dashes and underscores only.');
        return null;
      }

      // Whatever is already typed in the box rides along as the caption.
      var caption = textArea.value.trim();
      var url = API + 'upload?name=' + encodeURIComponent(file.name) +
                (caption ? '&text=' + encodeURIComponent(caption.slice(0, 4000)) : '') +
                (extra.secs ? '&secs=' + encodeURIComponent(String(Math.round(extra.secs))) : '');

      return file.arrayBuffer().then(function (buf) {
        return fetch(url, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: buf
        }).then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
          .then(function (r) { return { r: r, file: file }; });
      });
    }).then(function (out) {
      if (!out) return;
      if (out.r.ok) {
        textArea.value = '';
        drawFiles(out.r.files || []);
        if (out.r.message) {
          add([out.r.message]);
          thread.scrollTop = 0;
        }
        reset(out.file.name + ' sent.');
        setTimeout(function () { uhint.textContent = 'Encrypted, and never touches the public repo.'; }, 4000);
      } else {
        reset(out.r.error === 'too_big' ? 'Too big for one upload.' : 'That didn’t go through. Try again.');
      }
    }).catch(function () {
      reset('No connection. Nothing was sent.');
    });
  }

  pick.addEventListener('change', function () {
    if (pick.files && pick.files[0]) sendUpload(pick.files[0]);
  });

  filesToggle.addEventListener('click', function () {
    var open = side.classList.toggle('open');
    filesToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // ----------------------------------------------------------------- state

  function unlock(who, name) {
    me = who;
    gate.style.display = 'none';
    app.classList.add('on');
    // Don't steal focus on a phone -- it throws up the keyboard over the thread
    // before you have read a word of it.
    poll().then(function () { if (window.innerWidth > 860) textArea.focus(); });
    loadFiles();
    startPolling();
    refreshNotifyBtn();
    // Already granted from a previous visit? Re-subscribe silently; push
    // subscriptions expire and a stale one fails without telling anyone.
    if (canNotify && Notification.permission === 'granted') enablePush();
  }

  function lock() {
    me = null;
    latestKey = null;
    rendered = 0;
    reactions = {};
    // Signing out with the microphone live would leave it recording behind a
    // locked screen. Abandon it -- nothing half-recorded is worth keeping, and
    // a session that just ended cannot upload it anyway.
    stopRecording(true);
    // Same reasoning as the recording above: a call must not outlive the
    // session that authorised it, and the camera must not stay lit behind a
    // locked screen.
    if (typeof endCall === 'function') endCall(true);
    stopPolling();
    app.classList.remove('on');
    gate.style.display = '';
    side.classList.remove('open');
    Array.prototype.slice.call(thread.querySelectorAll('.msg')).forEach(function (n) { n.remove(); });
    fileList.textContent = '';
    whoStrip.textContent = '';
    closeGif();
    if (!empty.parentNode) thread.appendChild(empty);
    empty.textContent = 'Loading…';
    pinInput.value = '';
    pinInput.focus();
  }

  // ----------------------------------------------------------------- login

  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = pinInput.value.trim();
    if (!pin) return;
    gateGo.disabled = true;
    gateErr.textContent = '';
    api('login', { method: 'POST', body: JSON.stringify({ pin: pin }) }).then(function (r) {
      gateGo.disabled = false;
      if (r.ok) { unlock(r.who, r.name); return; }
      pinInput.value = '';
      pinInput.focus();
      if (r.error === 'locked') gateErr.textContent = 'Too many tries. Wait ' + r.retryAfter + 's.';
      else if (r.error === 'not_configured') gateErr.textContent = 'Not set up yet.';
      else if (r.retryAfter) gateErr.textContent = 'Wrong PIN. Locked for ' + r.retryAfter + 's.';
      else gateErr.textContent = 'Wrong PIN.';
    }).catch(function () {
      gateGo.disabled = false;
      gateErr.textContent = 'No connection.';
    });
  });

  // ------------------------------------------------------------------ send

  function send() {
    var body = textArea.value.trim();
    if (!body) return;
    sendBtn.disabled = true;
    hint.textContent = 'Sending…';
    api('send', { method: 'POST', body: JSON.stringify({ text: body }) }).then(function (r) {
      sendBtn.disabled = false;
      if (r._status === 401) { lock(); return; }
      if (!r.ok) {
        hint.textContent = r.error === 'too_long' ? 'Too long — trim it a bit.' : 'Didn’t send. Try again.';
        return;
      }
      textArea.value = '';
      // NOTE: latestKey is deliberately NOT advanced here. The cursor moves
      // only in poll(). Advancing it from your own echo skips the other
      // person's messages permanently -- add() dedupes the double render.
      hint.textContent = touchOnly ? 'Tap Send when you’re ready' : 'Enter sends · Shift+Enter for a new line';
      add([r.message]);
      thread.scrollTop = 0;
      textArea.focus();
    }).catch(function () {
