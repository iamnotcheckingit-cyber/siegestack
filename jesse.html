  /**
   * Hold the microphone, then send what it heard.
   *
   * Why this earns its place: a thirteen-year-old will say twenty seconds of
   * something he will not type three sentences of. It is the lowest-effort way
   * into this thread that exists.
   *
   * Nothing is uploaded until Send. Cancel drops the recording on the floor --
   * the audio never leaves the device, which is the one part of this feature
   * that has to be true rather than merely convenient. Note the asymmetry with
   * everything else here: once a voice message IS sent it is as permanent as
   * any other message, because storage is append-only and there is no delete.
   *
   * 32 kbps is chosen so five minutes lands comfortably inside the upload
   * limit; Opus at that rate is more than good enough for a voice. Some
   * browsers ignore the hint, so the size check in sendUpload() is still the
   * thing that actually holds.
   */
  var MAX_REC_SECS = 300;
  var REC_BITS = 32000;

  var rec = null;
  var recChunks = [];
  var recStream = null;
  var recTicker = null;
  var recStartedAt = 0;
  var recAbandoned = false;

  /**
   * The first container this browser admits to supporting.
   *
   * Chrome and Firefox give WebM/Opus; Safari gives MP4/AAC and nothing else.
   * Asking rather than sniffing the user agent is the same rule the
   * notification code follows -- capabilities are tested, never predicted.
   */
  var REC_TYPES = [
    ['audio/webm;codecs=opus', '.webm'],
    ['audio/webm', '.webm'],
    ['audio/mp4;codecs=mp4a.40.2', '.m4a'],
    ['audio/mp4', '.m4a'],
    ['audio/ogg;codecs=opus', '.ogg']
  ];

  function recFormat() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
    for (var i = 0; i < REC_TYPES.length; i++) {
      try {
        if (MediaRecorder.isTypeSupported(REC_TYPES[i][0])) return REC_TYPES[i];
      } catch (e) { /* a browser that throws on the question cannot do it */ }
    }
    return null;
  }

  var canRecord = Boolean(
    navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && recFormat()
  );

  function recTick() {
    var secs = (Date.now() - recStartedAt) / 1000;
    recTime.textContent = clock(secs);
    if (secs >= MAX_REC_SECS) {
      recHint.textContent = 'Five minutes is the limit — sending what you have.';
      stopRecording(false);
    }
  }

  function showRecBar(on) {
    recBar.hidden = !on;
    micBtn.classList.toggle('on', on);
    micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    // Re-armed only when a new recording starts. Both buttons disable
    // themselves the instant either is pressed, because MediaRecorder's stop
    // event is asynchronous and a second press in that window would tear the
    // recorder down before the first press had finished reading it.
    recStop.disabled = !on;
    recCancel.disabled = !on;
    // The camera and GIF buttons would both start a second thing competing for
    // the composer while a recording is live.
    photoBtn.disabled = on;
    gifBtn.disabled = on;
  }

  function teardownRecorder() {
    if (recTicker) { clearInterval(recTicker); recTicker = null; }
    if (recStream) {
      // Releases the microphone. Without this the browser keeps showing the
      // recording indicator after we are done with it, which on a phone looks
      // exactly like an app that is still listening.
      recStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      recStream = null;
    }
    rec = null;
    recChunks = [];
    showRecBar(false);
    recTime.textContent = '0:00';
    recHint.textContent = 'Recording…';
  }

  function startRecording() {
    var fmt = recFormat();
    micBtn.disabled = true;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      micBtn.disabled = false;
      recStream = stream;
      recChunks = [];
      recAbandoned = false;
      try {
        rec = new MediaRecorder(stream, { mimeType: fmt[0], audioBitsPerSecond: REC_BITS });
      } catch (e) {
        // A browser that rejects the options object still records with none.
        rec = new MediaRecorder(stream);
      }
      rec.addEventListener('dataavailable', function (e) {
        if (e.data && e.data.size) recChunks.push(e.data);
      });
      rec.addEventListener('stop', function () { finishRecording(fmt[1]); });

      recStartedAt = Date.now();
      recTime.textContent = '0:00';
      showRecBar(true);
      recTicker = setInterval(recTick, 250);
    }).catch(function (err) {
      micBtn.disabled = false;
      teardownRecorder();
      // Say which wall was hit. "Could not record" sends someone hunting
      // through settings that were never the problem.
      var kind = err && err.name;
      if (kind === 'NotAllowedError' || kind === 'SecurityError') {
        hint.textContent = 'Microphone blocked. Allow it for this site, then try again.';
      } else if (kind === 'NotFoundError' || kind === 'DevicesNotFoundError') {
        hint.textContent = 'No microphone found on this device.';
      } else {
        hint.textContent = 'Could not start recording. Tap 🎤 again to pick a sound file instead.';
        // Next press goes to the picker rather than failing the same way twice.
        canRecord = false;
      }
    });
  }

  function stopRecording(abandon) {
    recAbandoned = Boolean(abandon);
    recStop.disabled = true;
    recCancel.disabled = true;
    if (recTicker) { clearInterval(recTicker); recTicker = null; }
    if (rec && rec.state !== 'inactive') {
      try { rec.stop(); return; } catch (e) { /* fall through to the teardown */ }
    }
    teardownRecorder();
  }

  function finishRecording(ext) {
    var secs = Math.round((Date.now() - recStartedAt) / 1000);
    var chunks = recChunks.slice();
    var type = (rec && rec.mimeType) || '';
    var abandoned = recAbandoned;

    teardownRecorder();

    if (abandoned) { hint.textContent = 'Recording discarded. Nothing was sent.'; return; }
    if (!chunks.length) { hint.textContent = 'Nothing was recorded. Try again.'; return; }
    if (secs < 1) { hint.textContent = 'Too short — hold it a moment longer.'; return; }

    var blob = new Blob(chunks, type ? { type: type } : undefined);
    // The stamp keeps two recordings from the same phone apart, the same way
    // storedName() does on the server. Letters, digits, dots and dashes only,
    // because the upload endpoint's allowlist is strict and rejects the rest.
    var file = new File([blob], 'voice-' + Date.now() + ext, { type: blob.type || 'application/octet-stream' });
    hint.textContent = 'Sending ' + clock(secs) + ' voice message…';
    sendUpload(file, null, { secs: secs });
  }

  /**
   * The microphone button must never be a dead control -- the same rule the GIF

   * picker, which on iOS reaches Voice Memos. Either way pressing 🎤 sends a
   * voice message.
   */
  micBtn.addEventListener('click', function () {
    if (rec) { stopRecording(false); return; }

  recStop.addEventListener('click', function () { stopRecording(false); });
  recCancel.addEventListener('click', function () { stopRecording(true); });

  audioPick.addEventListener('change', function () {

  // --------------------------------------------------------------- gif button

  var gifTimer = null;

  function note(text) {

    gifGrid.appendChild(p);

  function drawGifs(gifs) {

      img.alt = g.title;

          .then(function (r) {

                      thread.scrollTop = 0;

  function searchGifs() {

  /**

   * GIPHY search needs an API key, which needs an account, which is a lot to
   * ask before a button does anything. So the button asks the server once
   * whether search is available: if it is, it opens the search box; if it is
   * not, it opens a .gif file picker and sends it the same way. Either way
   * pressing GIF sends a GIF.

   * `searchable` is null until we know, so the first press asks and then acts
   * rather than guessing wrong.
   */
  var searchable = null;

  function gifSearchAvailable() {
    if (searchable !== null) return Promise.resolve(searchable);
    return api('gif?q=test')
      .then(function (r) { searchable = !(r && r.error === 'no_key'); return searchable; })
      .catch(function () { return false; });

  gifBtn.addEventListener('click', function () {

    gifSearchAvailable().then(function (canSearch) {
      gifBtn.disabled = false;

  gifPick.addEventListener('change', function () {

  });
  gifClose.addEventListener('click', closeGif);
  gifQ.addEventListener('input', function () {
    clearTimeout(gifTimer);
    gifTimer = setTimeout(searchGifs, 350);
  });
  gifQ.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(gifTimer); searchGifs(); }
    if (e.key === 'Escape') closeGif();

  sendBtn.addEventListener('click', send);
  // A touch keyboard has no Shift+Enter, so Enter must insert a newline there
  // and the Send button becomes the only way to send. On a hardware keyboard
  // Enter still sends. isComposing guards IME input, where Enter commits a
  // candidate rather than ending the message.
  var touchOnly = window.matchMedia && window.matchMedia('(hover:none) and (pointer:coarse)').matches;
  if (touchOnly) {
    textArea.setAttribute('enterkeyhint', 'enter');
    hint.textContent = 'Tap Send when you’re ready';
  }
  textArea.addEventListener('keydown', function (e) {

  document.getElementById('exportBtn').addEventListener('click', function () {

  document.getElementById('signOut').addEventListener('click', function () {
    api('logout', { method: 'POST' }).then(lock).catch(lock);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && me) poll();

  // ------------------------------------------------------------------ emoji

  /**
   * Inserts at the caret rather than appending, because the obvious use is
   * putting one in the middle of a sentence you have already typed.
   */
  var EMOJI = (
    '😀😃😄😁😆😅😂🤣🙂🙃😉😊😇🥰😍😘😋😜🤪🤗🤔🤨😐😑😴😪😌😔😞😢😭😤😠😡🥺😳🤯😱' +
    '👍👎👌✌️🤞🤙👏🙌🙏💪🤝👋🫶❤️🧡💛💚💙💜🖤🤍💔💯🔥⭐✨🎉🎂🎁' +
    '☕🍕🍔🍟🌮🍎🍌🍺🍻🥤🍦🍪' +
    '⚽🏀🏈⚾🎾🎣🎸🎮🎯🚗🚙🛻🚚✈️🏠🌧️☀️🌙⛄🐶🐱🐟🦌'
  );

  var emojiBtn = document.getElementById('emojiBtn');
  var emojiBox = document.getElementById('emojiBox');
  var emojiGrid = document.getElementById('emojiGrid');

  function insertEmoji(ch) {
    var el = textArea;
    var start = el.selectionStart, end = el.selectionEnd;
    if (typeof start !== 'number') { el.value += ch; }
    else {
      el.value = el.value.slice(0, start) + ch + el.value.slice(end);
      var at = start + ch.length;
      el.setSelectionRange(at, at);
    }
    // Fire input so anything watching the composer (autogrow, send-enable)
    // sees the change -- setting .value directly does not dispatch one.
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.focus();
  }

  function buildEmoji() {
    if (emojiGrid.childNodes.length) return;
    // Array.from, not split(''), because these are surrogate pairs and several
    // carry a variation selector -- splitting by code unit tears them in half.
    var seen = {};
    Array.from(EMOJI).reduce(function (acc, ch) {
      // Recombine variation selectors onto the character they modify.
      if (ch === '️' && acc.length) { acc[acc.length - 1] += ch; return acc; }
      acc.push(ch); return acc;
    }, []).forEach(function (ch) {
      if (seen[ch]) return;
      seen[ch] = 1;
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.setAttribute('aria-label', ch);
      b.addEventListener('click', function () { insertEmoji(ch); });

    emojiBtn.setAttribute('aria-expanded', 'false');

  if (emojiBtn) emojiBtn.addEventListener('click', function () {

      emojiBtn.setAttribute('aria-expanded', 'true');

  document.addEventListener('keydown', function (e) {

  // ------------------------------------------------------------- video calls

  /**
   * Two-person WebRTC over the polled signalling endpoint.
   *
   * The ICE servers are fetched from the server rather than written here,
   * because TURN credentials are minted per call and must not sit in a public
   * repository. STUN discovers the public address a NAT gave you and is free;
   * it is enough when at least one side is not behind a symmetric NAT. TURN
   * relays the media itself and is what makes a call work when both sides are
   * on mobile data behind carrier-grade NAT.
   *
   * The fallback is STUN-only, which is what this did before TURN existed --
   * a server that cannot mint credentials degrades the call rather than
   * refusing it.
   */
  var STUN_ONLY = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };

  var iceConf = null;      // last fetched config
  var iceConfAt = 0;       // when, so short-lived credentials are not reused past their life
  var iceMode = 'unknown'; // what the server said it could offer

  function getIce() {
    // Credentials expire. Re-fetch once they are past half their stated life,
    // which is cheap and avoids a call failing on a credential that died
    // between two rings.
    var age = (Date.now() - iceConfAt) / 1000;
    if (iceConf && age < (iceConf._ttl || 3600) / 2) return Promise.resolve(iceConf);

    return api('turn').then(function (r) {
      if (!r || !r.ok || !r.iceServers || !r.iceServers.length) return STUN_ONLY;
      iceConf = { iceServers: r.iceServers, _ttl: r.ttl || 3600 };
      iceConfAt = Date.now();
      iceMode = r.mode || 'unknown';
      return iceConf;
    }).catch(function () {
      return STUN_ONLY;
    });
  }

  var CALL_POLL_MS = 1000;      // while a call is being set up or is running
  var CALL_TIMEOUT_MS = 45000;  // unanswered offers give up rather than ring forever

  var pc = null;               // RTCPeerConnection
  var localStream = null;
  var callTimer = null;        // fast signal poll
  var ringTimer = null;        // gives up on an unanswered call
  var callActive = false;      // we are in or setting up a call
  var pendingOffer = null;     // an offer that arrived and is waiting on Answer
  var politeQueue = [];        // ICE that arrived before the description did

  var callWrap = document.getElementById('callWrap');
  var remoteVid = document.getElementById('remoteVid');
  var localVid = document.getElementById('localVid');
  var callState = document.getElementById('callState');
  var callBtn = document.getElementById('callBtn');
  var callEnd = document.getElementById('callEnd');
  var micTgl = document.getElementById('micTgl');
  var camTgl = document.getElementById('camTgl');
  var ringBar = document.getElementById('ringBar');
  var ringWho = document.getElementById('ringWho');
  var ringAccept = document.getElementById('ringAccept');
  var ringDecline = document.getElementById('ringDecline');

  // getUserMedia is absent, not merely unsupported, on a page served over
  // plain HTTP -- and it throws rather than returning false.
  var canCall = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection);
  if (!canCall && callBtn) {
    callBtn.disabled = true;
    callBtn.title = 'This browser cannot make calls';
  }

  function signal(type, data) {
    return api('call', { method: 'POST', body: JSON.stringify({ type: type, data: data || null }) })
      .catch(function () { /* a dropped candidate is survivable; a dropped offer is not, and is retried by the caller giving up */ });
  }

  function setCallState(t) { if (callState) callState.textContent = t; }

  function startCallPolling() {
    stopCallPolling();
    callTimer = setInterval(drainSignals, CALL_POLL_MS);
  }
  function stopCallPolling() { if (callTimer) { clearInterval(callTimer); callTimer = null; } }

  /**
   * The thread poll runs at 6s, which is the right cadence for messages and far
   * too slow to set a call up -- an offer would sit unseen for most of a
   * ringing cycle. This runs alongside it and only while it is needed.
   */
  function drainSignals() {
    return api('call').then(function (r) {
      if (!r || !r.ok || !r.signals) return;
      return r.signals.reduce(function (chain, sig) {
        return chain.then(function () { return handleSignal(sig); });
      }, Promise.resolve());
    }).catch(function () {});
  }

  function handleSignal(sig) {
    if (sig.type === 'offer')   return onOffer(sig);
    if (sig.type === 'answer')  return onAnswer(sig);
    if (sig.type === 'ice')     return onIce(sig);
    if (sig.type === 'decline') { endCall(false); showNote('Call declined.'); return; }
    if (sig.type === 'busy')    { endCall(false); showNote('They are already on a call.'); return; }
    if (sig.type === 'hangup')  { endCall(false); return; }
  }

  function showNote(text) {
    // The composer's hint line, which is where every other transient message on
    // this page goes. Never alert() -- a modal dialog blocks every later browser
    // event, including the poll that would tell us the call ended.
    hint.textContent = text;
  }

  function getMedia() {
    // Audio-only is a real outcome, not a failure: a laptop with no camera, or
    // a phone where camera permission was refused but the microphone was not.
    return navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .catch(function () {
        return navigator.mediaDevices.getUserMedia({ video: false, audio: true });

  function newPeer(conf) {
    var conn = new RTCPeerConnection(conf || STUN_ONLY);

    conn.onicecandidate = function (e) {
      if (e.candidate) signal('ice', e.candidate.toJSON ? e.candidate.toJSON() : e.candidate);
    };

    conn.ontrack = function (e) {
      if (remoteVid.srcObject !== e.streams[0]) {
        remoteVid.srcObject = e.streams[0];
        // Safari will not start a remote stream without an explicit play(), and
        // rejects it silently if it does not consider this a user gesture.
        remoteVid.play().catch(function () {});
      }
    };

    conn.onconnectionstatechange = function () {
      var s = conn.connectionState;
      if (s === 'connected') setCallState('');
      else if (s === 'connecting') setCallState('Connecting…');
      else if (s === 'failed') {
        // Distinguish the two failures. Without a relay configured this is the
        // expected outcome on mobile data and the fix is a server setting, not
        // a retry. With one configured it is a genuine fault, and saying "needs
        // TURN" when TURN is already on would send someone to fix the wrong
        // thing.
        setCallState(iceMode === 'stun-only' || iceMode === 'unknown'
          ? 'Could not connect — this network needs a relay (TURN is not configured).'
          : 'Could not connect. The relay did not work on this network.');
        setTimeout(function () { endCall(true); }, 4000);

      }

  function openCallUI() {

    // wake locks are not universally available and must never break the call.
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) { callWrap._lock = l; }).catch(function () {});
    }

  function startCall() {
    if (!canCall || callActive) return;
    callActive = true;
    openCallUI();
    setCallState('Asking for camera…');

    // Media and relay credentials are fetched together: neither is useful
    // without the other, and asking for them in series adds a round trip to
    // every call.
    Promise.all([getMedia(), getIce()]).then(function (both) {
      localStream = both[0];
      localVid.srcObject = localStream;
      localVid.play().catch(function () {});
      setCallState('Ringing…');

      pc = newPeer(both[1]);
      localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });

      return pc.createOffer().then(function (offer) {
        return pc.setLocalDescription(offer);
      }).then(function () {
        return signal('offer', { sdp: pc.localDescription.sdp, type: pc.localDescription.type });
      }).then(function () {
        startCallPolling();
        ringTimer = setTimeout(function () {
          if (pc && pc.connectionState !== 'connected') {
            endCall(true);
            showNote('No answer.');
          }
        }, CALL_TIMEOUT_MS);
      });
    }).catch(function () {
      setCallState('');
      endCall(false);
      showNote('Camera and microphone are both blocked, so there is nothing to call with.');
    });
  }

  function onOffer(sig) {
    // Already busy: tell them so, rather than letting a second offer quietly
    // replace the call currently in progress.
    if (callActive) { signal('busy'); return; }
    pendingOffer = sig.data;
    ringWho.textContent = (whoName(sig.from) || 'Someone') + ' is calling';
    ringBar.hidden = false;
    startCallPolling();   // so a hangup before we answer still reaches us
  }

  function whoName(id) {
    if (!id) return '';
    return id.charAt(0).toUpperCase() + id.slice(1);
  }

  function acceptCall() {
    if (!pendingOffer) return;
    var offer = pendingOffer;
    pendingOffer = null;
    ringBar.hidden = true;
    callActive = true;
    openCallUI();
    setCallState('Asking for camera…');

    Promise.all([getMedia(), getIce()]).then(function (both) {
      localStream = both[0];
      localVid.srcObject = localStream;
      localVid.play().catch(function () {});
      setCallState('Connecting…');

      pc = newPeer(both[1]);
      localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });

      return pc.setRemoteDescription(new RTCSessionDescription(offer)).then(function () {
        return flushIce();
      }).then(function () {
        return pc.createAnswer();
      }).then(function (answer) {
        return pc.setLocalDescription(answer);
      }).then(function () {
        return signal('answer', { sdp: pc.localDescription.sdp, type: pc.localDescription.type });
      }).then(function () {
        startCallPolling();
      });
    }).catch(function () {
      setCallState('');
      signal('decline');
      endCall(false);
      showNote('Camera and microphone are both blocked, so the call could not be answered.');
    });
  }

  function onAnswer(sig) {
    if (!pc || !sig.data) return Promise.resolve();
    // An answer arriving twice would tear down a working connection.
    if (pc.signalingState === 'stable') return Promise.resolve();
    return pc.setRemoteDescription(new RTCSessionDescription(sig.data)).then(function () {
      return flushIce();
    }).then(function () {
      if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
    });
  }

  function onIce(sig) {
    if (!sig.data) return Promise.resolve();
    // Candidates routinely arrive before the description they belong to.
    // Adding one then throws, so they are held and replayed once it lands.
    if (!pc || !pc.remoteDescription || !pc.remoteDescription.type) {
      politeQueue.push(sig.data);
      return Promise.resolve();
    }
    return pc.addIceCandidate(new RTCIceCandidate(sig.data)).catch(function () {});
  }

  function flushIce() {
    var queued = politeQueue.splice(0, politeQueue.length);
    return queued.reduce(function (chain, cand) {
      return chain.then(function () {
        return pc.addIceCandidate(new RTCIceCandidate(cand)).catch(function () {});
      });
    }, Promise.resolve());
  }

  /**
   * @param tell  whether to send a hangup. False when we are reacting to the
   *              other side's hangup, so the two do not bounce one back and
   *              forth at each other.
   */
  function endCall(tell) {
    if (tell && callActive) signal('hangup');

    callActive = false;
    pendingOffer = null;
    politeQueue.length = 0;

    if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
    stopCallPolling();

    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (localStream) {
      // Stopping every track is what actually turns the camera light off.
      localStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      localStream = null;
    }
    localVid.srcObject = null;
    remoteVid.srcObject = null;

    if (callWrap._lock) { try { callWrap._lock.release(); } catch (e) {} callWrap._lock = null; }
    callWrap.hidden = true;
    ringBar.hidden = true;
    setCallState('Connecting…');
    micTgl.setAttribute('aria-pressed', 'false');
    camTgl.setAttribute('aria-pressed', 'false');
  }

  function toggleTrack(kind, btn) {
    if (!localStream) return;
    var tracks = kind === 'audio' ? localStream.getAudioTracks() : localStream.getVideoTracks();
    if (!tracks.length) return;
    var off = tracks[0].enabled;          // about to become the new state
    tracks.forEach(function (t) { t.enabled = !off; });
    btn.setAttribute('aria-pressed', off ? 'true' : 'false');
  }

  if (callBtn) callBtn.addEventListener('click', function () { startCall(); });
  if (callEnd) callEnd.addEventListener('click', function () { endCall(true); });
  if (micTgl) micTgl.addEventListener('click', function () { toggleTrack('audio', micTgl); });
  if (camTgl) camTgl.addEventListener('click', function () { toggleTrack('video', camTgl); });
  if (ringAccept) ringAccept.addEventListener('click', function () { acceptCall(); });
  if (ringDecline) ringDecline.addEventListener('click', function () {
    pendingOffer = null;
    ringBar.hidden = true;
    stopCallPolling();
    signal('decline');
  });

  // Closing the tab mid-call must hang up, or the other end rings until it
  // times out. pagehide rather than unload -- unload never fires on iOS.
  window.addEventListener('pagehide', function () { if (callActive) endCall(true); });

  // ------------------------------------------------------------------ boot

  // Ask the server who we are. A valid cookie means no PIN prompt at all.
  api('session').then(function (r) {
    if (r.ok && r.who) unlock(r.who, r.name);
    else pinInput.focus();
  }).catch(function () { pinInput.focus(); });
})();
</script>
</body>
</html>
