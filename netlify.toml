# -----------------------------------------------------------------------------
# /secret -- browser-side encrypted messages.
#
# The page's whole claim is that the message never leaves the browser: it is
# encrypted with Web Crypto and parked in the URL fragment, which browsers do
# not transmit. The CSP below is what turns that from a promise into something
# the browser enforces.
#
#   connect-src 'none'   no fetch, no XHR, no beacon, no WebSocket. The page
#                        cannot send the message anywhere even if it tried.
#   default-src 'self'   no third-party anything. This is also why the page
#                        carries no analytics, unlike every other page here.
#   form-action 'none'   nothing can be POSTed off the page either.
#   base-uri 'none'      an injected <base> cannot re-point relative URLs.
#
# 'unsafe-inline' is present because the page is a single self-contained file
# with an inline <script> and inline <style>. That is a deliberate trade: it
# weakens the XSS story in exchange for there being no external asset to fetch,
# pin, or have swapped. connect-src 'none' is what carries the actual guarantee,
# and it holds regardless of what any inline script does.
#
# noindex, because a tool for sending secrets does not need to be in search
# results, and the URL is more useful shared directly than crawled.
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/secret"
  to = "/secret.html"
  status = 200

[[redirects]]
  from = "/secret.html"
  to = "/secret"
  status = 301
  force = true

[[headers]]
  for = "/secret"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/secret.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

# -----------------------------------------------------------------------------
# /jesse -- the private thread. See netlify/functions/jesse-api.mjs.
#
# Four things keep it private and all four are load-bearing:
#   1. The PIN check, server-side, in the function. That is the actual lock.
#   2. noindex here AND in _headers, because which of those two files wins a
#      conflict is not worth betting a private page on. They agree, so it
#      cannot matter.
#   3. Absent from sitemap.xml, and linked from no other page.
#   4. private-files/ is 404'd below, so the only route to those downloads is
#      through the authenticated function.
#
# robots.txt is deliberately NOT given a Disallow for this path -- that file is
# public, and a Disallow line would advertise the URL to every crawler and
# every idle reader. X-Robots-Tag is the stronger signal anyway: Disallow only
# stops crawling, noindex stops listing.
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/jesse"
  to = "/jesse.html"
  status = 200

[[headers]]
  for = "/jesse"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/jesse.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/jesse/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Referrer-Policy = "no-referrer"

# The service worker must NOT inherit the year-long immutable cache that the
# /*.js rule above applies to every other script. A service worker frozen for a
# year is a bug that cannot be fixed by deploying -- the browser would keep
# running the old one. This rule has to stay ahead of any future /*.js change.
[[headers]]
  for = "/jesse-sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"
    X-Robots-Tag = "noindex, nofollow"

# -----------------------------------------------------------------------------
# /nicole -- a second private thread, built from the same code as /jesse but
# sharing nothing with it: separate blob stores, separate session cookie,
# separate encryption keys, separate files, separate push subscriptions.
# NICOLES_PIN opens this and nothing else; JESSES_PIN does not open it.
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/nicole"
  to = "/nicole.html"
  status = 200

[[headers]]
  for = "/nicole"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/nicole.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Cache-Control = "no-store, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/nicole/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/nicole-sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"
    X-Robots-Tag = "noindex, nofollow"

# The publish directory is the repo root, so anything committed is on the web by
# default. These files must not be. This closes the door; the function opens it
# only for a valid session.
[[redirects]]
  from = "/private-files/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/private-files-nicole/*"
  to = "/404.html"
  status = 404
  force = true

# ...and this is what puts them inside the function bundle so it can read them.
# Without it the rail is empty and the reason is not obvious from the logs.
[functions]
  included_files = ["private-files/**", "private-files-nicole/**"]

